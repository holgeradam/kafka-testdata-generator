asyncapi: 2.6.0
info:
  title: Order events
  version: 1.0.0
channels:
  orders.created:
    publish:
      message:
        $ref: '#/components/messages/OrderCreated'
components:
  messages:
    OrderCreated:
      name: OrderCreated
      payload:
        type: object
        required:
          - orderId
          - customer
          - status
          - totalAmount
          - currency
          - createdAt
        properties:
          orderId:
            type: string
            format: uuid
          customer:
            type: object
            required:
              - customerId
              - name
              - email
            properties:
              customerId:
                type: string
                format: uuid
              name:
                type: string
              email:
                type: string
                format: email
              city:
                type: string
          status:
            type: string
            enum:
              - pending
              - confirmed
              - shipped
          totalAmount:
            type: number
            minimum: 15
            maximum: 500
          currency:
            type: string
            enum:
              - EUR
              - USD
              - CHF
          createdAt:
            type: string
            format: date-time
          items:
            type: array
            minItems: 1
            maxItems: 4
            items:
              type: object
              required:
                - sku
                - quantity
              properties:
                sku:
                  type: string
                  pattern: '^[A-Z]{3}-\d{4}$'
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 5
