asyncapi: 3.0.0
info:
  title: Order Service
  version: 1.0.0
  description: Example AsyncAPI 3.0 spec for generating test order data

channels:
  ordersCreated:
    address: orders.created
    messages:
      OrderCreated:
        $ref: '#/components/messages/OrderCreated'

operations:
  publishOrderCreated:
    action: send
    channel:
      $ref: '#/channels/ordersCreated'
    messages:
      - $ref: '#/channels/ordersCreated/messages/OrderCreated'

components:
  messages:
    OrderCreated:
      name: OrderCreated
      contentType: application/json
      payload:
        $ref: '#/components/schemas/Order'
  schemas:
    Order:
      type: object
      required:
        - orderId
        - customerId
        - status
        - totalAmount
        - currency
        - createdAt
      properties:
        orderId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        customer:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            phone:
              type: string
            city:
              type: string
            country:
              type: string
        status:
          type: string
          enum:
            - pending
            - confirmed
            - processing
            - shipped
            - delivered
            - cancelled
        totalAmount:
          type: number
          minimum: 0
          maximum: 10000
        currency:
          type: string
          enum:
            - USD
            - EUR
            - GBP
            - JPY
        items:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            properties:
              sku:
                type: string
                pattern: "^[A-Z]{3}-[A-Z]{2}-\\d{4}$"
              name:
                type: string
              quantity:
                type: integer
                minimum: 1
                maximum: 100
              price:
                type: number
                minimum: 0
                maximum: 5000
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
